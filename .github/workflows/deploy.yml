name: Deploy Static Website to AWS S3

on:
  push:
    branches:
      - main  # Trigger pipeline on push to main branch
    # A push that only adds files to uploads/ is deployed by the
    # workflow_run trigger below once the post has been generated.
    paths-ignore:
      - "uploads/**"
  # The converter commits new posts with the built-in GITHUB_TOKEN, and pushes
  # made with that token never start other workflows. Deploy when it finishes
  # instead, so each new post, the sitemap, feed and llms.txt go live right away.
  workflow_run:
    workflows: ["Convert Word Docs to Blog Posts"]
    types: [completed]
    branches: [main]

# One deploy at a time, so an older checkout can never finish last and
# remove newer files with --delete.
concurrency:
  group: deploy-blog
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main  # after a conversion, deploy the commit the converter just pushed

    # --- UNCOMMENT & ADJUST IF USING A BUILD STEP (React, Vue, Vite, etc.) ---
    # - name: Setup Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: '20'
    #
    # - name: Install Dependencies & Build
    #   run: |
    #     npm ci
    #     npm run build
    # ------------------------------------------------------------------------

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  # Replace with your S3 bucket's AWS region

    - name: Sync files to S3
      run: |
        aws s3 sync ./ s3://blog-ljwebmanagement --delete --exclude ".git/*" --exclude ".github/*"
        # If deploying a build folder (e.g. dist/ or build/), change `./` to `./dist`

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"